# Odysight CRM — Nginx reverse proxy (local HTTP first).
#
# Mirrors the previous Caddyfile behavior:
#   /api/* -> api:8080, everything else -> web:4321
#
# Local: plain HTTP on port 80. server_name "_" accepts localhost, LAN IPs
# (e.g. http://192.168.1.50 for team use), or any domain.
#
# Production HTTPS: enable the commented 443 server block below with your
# certs mounted, set server_name to your real domain, and optionally redirect
# port 80 -> 443.

upstream odysight_api {
  server api:8080;
}

upstream odysight_web {
  server web:4321;
}

server {
  listen 80;
  server_name _;

  # Must stay >= MAX_UPLOAD_MB (8) for proof-of-work photo uploads.
  client_max_body_size 10m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Same baseline headers the Caddyfile applied.
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location /api/ {
    proxy_pass http://odysight_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
  }

  location / {
    proxy_pass http://odysight_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
  }
}

