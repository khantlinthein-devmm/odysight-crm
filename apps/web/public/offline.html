<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1e3a5f" />
    <title>Offline · Smile Clean</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #f8fafc; color: #0f172a;
        display: grid; place-items: center; min-height: 100vh; margin: 0; }
      .card { background: #fff; border-radius: 1rem; padding: 2rem; max-width: 22rem;
        text-align: center; box-shadow: 0 10px 30px rgba(15, 23, 42, .08); }
      a { display: inline-block; margin-top: 1rem; color: #1e3a5f; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="card">
      <p style="font-size:2rem">📶</p>
      <h1>You're offline</h1>
      <p>This page hasn't been opened while online yet, so it isn't cached.
        Queued field work is safe on this device and will sync automatically.</p>
      <a href="/calculator">Open calculator</a><br />
      <a href="/dashboard">Open dashboard</a>
    </div>
  </body>
</html>
